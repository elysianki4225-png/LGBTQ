# ---------------------------------------------------------------------------
# 光谱档案 · nginx 站点配置示例（部署到域名根目录，如 https://lgbtq.example.org/）
#
# 与 deploy/install.sh 生成的配置等价，供手动部署或二次修改参考。
# 使用前请替换：
#   /var/www/lgbtq         → 你的站点目录
#   lgbtq.example.org      → 你的域名
#   /etc/letsencrypt/live/lgbtq.example.org/  → 你的证书路径
#
# 校验并生效：nginx -t && systemctl reload nginx
# 依据：Mozilla SSL Configuration Generator（Intermediate）、nginx 官方文档。
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name lgbtq.example.org;

    # ACME HTTP-01 挑战目录（certbot --webroot）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lgbtq;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lgbtq.example.org;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/lgbtq.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lgbtq.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 站点根目录 ----
    root  /var/www/lgbtq;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    absolute_redirect off;
    autoindex off;

    # ---- 安全响应头（与 src/layout.html 的 CSP 一致） ----
    # 注意：location 内一旦使用 add_header，会覆盖 server 级别的全部 add_header。
    # 因此本配置把安全头放在 server 级别，location 内只用 expires / access_log。
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---- 静态资源长缓存（构建时带 ?v= 指纹） ----
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ---- 页面：干净 URL 与 /path/ → /path/index.html ----
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---- 隐藏文件与敏感后缀 ----
    location ~ /\. { deny all; }
    location ~* \.(?:bak|conf|inc|log|sh|sql|tar|gz|zip)$ { deny all; }

    # ---- 隐私：默认不写访问日志 ----
    access_log off;
    error_log  /var/log/nginx/lgbtq.error.log warn;
}

# 若使用 nip.io（无自有域名），把两处 server_name 替换为：
#   server_name 203.0.113.10.nip.io;
# 证书路径相应改为 /etc/letsencrypt/live/203.0.113.10.nip.io/…
